<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutri Saúde - Redefinir Senha</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/esqueci-senha.css">
</head>
<body>

  <main class="recovery-container">
    
    <section class="recovery-header-section">
      <div class="recovery-illustration">
        <i class="fa-solid fa-laptop-code"></i>
      </div>
      <h1 class="recovery-title">Redefinir Senha</h1>
      <p class="recovery-subtitle">
        Informe o e-mail para o qual deseja redefinir a sua senha.
      </p>
    </section>

    <section class="recovery-form-section">
      <div class="recovery-form-wrapper">
        
        <form action="" method="POST">
          
          <div class="input-group">
            <i class="fa-regular fa-envelope fa-icon-left"></i>
            <input type="email" class="input-field" placeholder="Adicione seu E-mail" required>
          </div>

          <button type="submit" class="btn-redefinir">
            Redefinir Senha
          </button>

          <div class="back-to-login">
            <p>Não possui uma conta?</p>
            <a href="login.html" class="back-link">
              Voltar ao login <i class="fa-solid fa-arrow-right"></i>
            </a>
          </div>

        </form>

      </div>
    </section>

  </main>

</body>
</html>
